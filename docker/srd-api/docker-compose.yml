services:
  db:
    image: ghcr.io/5e-bits/5e-database:latest
    restart: unless-stopped

  cache:
    image: redis:6.2.5
    restart: unless-stopped

  api:
    image: ghcr.io/5e-bits/5e-srd-api:latest
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://db/5e-database
      REDIS_URL: redis://cache:6379
    ports:
      - '${SRD_API_PORT:-3000}:3000'
    depends_on:
      - db
      - cache
